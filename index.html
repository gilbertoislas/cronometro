<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cronómetro</title>
  
  <!-- Configuración para que funcione como App en iOS y Android -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cronómetro">
  <meta name="theme-color" content="#0f172a">

  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --start: #10b981;
      --pause: #f59e0b;
      --reset: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 24px) 20px env(safe-area-inset-bottom, 32px);
      overflow: hidden;
    }

    header {
      width: 100%;
      text-align: center;
      padding-top: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .display-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
    }

    .time {
      font-size: clamp(3.5rem, 15vw, 5.5rem);
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
      line-height: 1;
    }

    .milliseconds {
      font-size: clamp(1.8rem, 7vw, 2.5rem);
      color: var(--accent);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      margin-top: 8px;
    }

    .laps-container {
      width: 100%;
      max-width: 400px;
      height: 28vh;
      overflow-y: auto;
      margin-bottom: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .lap-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
    }

    .lap-num {
      color: var(--muted);
    }

    .controls {
      display: flex;
      gap: 24px;
      width: 100%;
      max-width: 400px;
      justify-content: center;
      padding-bottom: 16px;
    }

    button {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: scale(0.93);
    }

    #btnSecondary {
      background-color: var(--surface);
      color: var(--text);
    }

    #btnPrimary {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--start);
      border: 2px solid var(--start);
    }

    #btnPrimary.running {
      background-color: rgba(245, 158, 11, 0.2);
      color: var(--pause);
      border-color: var(--pause);
    }
  </style>
</head>
<body>

  <header>Cronómetro</header>

  <div class="display-container">
    <div class="time" id="mainTime">00:00</div>
    <div class="milliseconds" id="msTime">.00</div>
  </div>

  <div class="laps-container" id="lapsList"></div>

  <div class="controls">
    <button id="btnSecondary" onclick="handleSecondary()">Reiniciar</button>
    <button id="btnPrimary" onclick="toggleTimer()">Iniciar</button>
  </div>

  <script>
    // --- 1. GENERACIÓN AUTOMÁTICA DE ÍCONO Y MANIFEST (PWA EN UN SOLO ARCHIVO) ---
    (function setupPWA() {
      const svgIcon = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="115" fill="#0f172a"/>
          <circle cx="256" cy="272" r="150" fill="none" stroke="#38bdf8" stroke-width="24"/>
          <rect x="216" y="72" width="80" height="24" rx="12" fill="#38bdf8"/>
          <line x1="256" y1="272" x2="256" y2="175" stroke="#f8fafc" stroke-width="22" stroke-linecap="round"/>
          <line x1="256" y1="272" x2="320" y2="272" stroke="#10b981" stroke-width="18" stroke-linecap="round"/>
          <circle cx="256" cy="272" r="16" fill="#f8fafc"/>
        </svg>`;
      
      const iconUrl = 'data:image/svg+xml;base64,' + btoa(svgIcon);

      // Ícono para iOS
      const appleIcon = document.createElement('link');
      appleIcon.rel = 'apple-touch-icon';
      appleIcon.href = iconUrl;
      document.head.appendChild(appleIcon);

      // Favicon estándar
      const favIcon = document.createElement('link');
      favIcon.rel = 'icon';
      favIcon.href = iconUrl;
      document.head.appendChild(favIcon);

      // Manifest dinámico para pantalla completa (standalone)
      const manifest = {
        name: "Cronómetro",
        short_name: "Cronómetro",
        start_url: window.location.href,
        display: "standalone",
        background_color: "#0f172a",
        theme_color: "#0f172a",
        icons: [{
          src: iconUrl,
          sizes: "512x512",
          type: "image/svg+xml",
          purpose: "any maskable"
        }]
      };

      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = URL.createObjectURL(manifestBlob);
      document.head.appendChild(manifestLink);
    })();

    // --- 2. LÓGICA DEL CRONÓMETRO DE ALTA PRECISIÓN ---
    let startTime = 0;
    let elapsedTime = 0;
    let timerInterval = null;
    let isRunning = false;
    let laps = [];

    const mainTimeEl = document.getElementById('mainTime');
    const msTimeEl = document.getElementById('msTime');
    const btnPrimary = document.getElementById('btnPrimary');
    const btnSecondary = document.getElementById('btnSecondary');
    const lapsList = document.getElementById('lapsList');

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const centiseconds = Math.floor((ms % 1000) / 10);

      const pad = (n) => n.toString().padStart(2, '0');
      const main = hours > 0 
        ? `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`
        : `${pad(minutes)}:${pad(seconds)}`;
      
      return { main, ms: `.${pad(centiseconds)}` };
    }

    function updateDisplay() {
      const now = performance.now();
      const currentElapsed = elapsedTime + (now - startTime);
      const formatted = formatTime(currentElapsed);
      mainTimeEl.textContent = formatted.main;
      msTimeEl.textContent = formatted.ms;
    }

    function toggleTimer() {
      if (!isRunning) {
        startTime = performance.now();
        timerInterval = requestAnimationFrame(loop);
        isRunning = true;
        btnPrimary.textContent = 'Pausar';
        btnPrimary.classList.add('running');
        btnSecondary.textContent = 'Vuelta';
      } else {
        elapsedTime += performance.now() - startTime;
        cancelAnimationFrame(timerInterval);
        isRunning = false;
        btnPrimary.textContent = 'Iniciar';
        btnPrimary.classList.remove('running');
        btnSecondary.textContent = 'Reiniciar';
      }
    }

    function loop() {
      if (!isRunning) return;
      updateDisplay();
      timerInterval = requestAnimationFrame(loop);
    }

    function handleSecondary() {
      if (isRunning) {
        // Registrar vuelta
        const currentElapsed = elapsedTime + (performance.now() - startTime);
        const formatted = formatTime(currentElapsed);
        laps.unshift({ num: laps.length + 1, time: `${formatted.main}${formatted.ms}` });
        renderLaps();
      } else {
        // Reiniciar todo
        elapsedTime = 0;
        laps = [];
        mainTimeEl.textContent = '00:00';
        msTimeEl.textContent = '.00';
        renderLaps();
      }
    }

    function renderLaps() {
      lapsList.innerHTML = laps.map(lap => `
        <div class="lap-item">
          <span class="lap-num">Vuelta ${lap.num}</span>
          <span>${lap.time}</span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
